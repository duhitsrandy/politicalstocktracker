# Hourly forward-return updates (not available on Vercel Hobby built-in crons).

name: Cron — update forward returns

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update forward returns
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          missing=""
          [ -z "$CRON_SECRET" ] && missing="${missing} CRON_SECRET"
          [ -z "$VERCEL_APP_URL" ] && missing="${missing} VERCEL_APP_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions repository secrets:${missing}"
            echo "Add them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          url="${VERCEL_APP_URL%/}/api/cron/update-forward-returns"
          http_code=$(curl -sS -o /tmp/cron-body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url")
          echo "HTTP ${http_code} from ${url}"
          cat /tmp/cron-body.txt
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cron request failed. Match CRON_SECRET with Vercel Production env."
            exit 1
          fi
